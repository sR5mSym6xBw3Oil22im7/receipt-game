name: auto-loop

# PRにラベル auto-loop を付けると起動する（最大3周の修正と、最後の確認1回）。
# 成功して修正があるときだけ auto-fix/<PR番号> に push する。マージは人が行う。
on:
  pull_request:
    types: [labeled]

concurrency:
  group: auto-loop-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write        # auto-fix/<PR番号> ブランチへのpush
  pull-requests: write   # 結果のコメント投稿、修正PRの作成

jobs:
  loop:
    # 同一リポジトリのPRだけを対象にする（forkのPRにはSecretを渡さない）
    if: >-
      github.event.label.name == 'auto-loop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 準備
        id: start
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir .auto-loop
          echo ".auto-loop/" >> .git/info/exclude   # 作業用ファイルをコミットに含めない

      - name: 第1周
        id: r1
        uses: ./.github/actions/loop-round
        with:
          round: 1
          allow_fix: true
          start_sha: ${{ steps.start.outputs.sha }}
          base_ref: ${{ github.event.pull_request.base.ref }}
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}

      - name: 第2周
        id: r2
        if: steps.r1.outputs.status == 'continue'
        uses: ./.github/actions/loop-round
        with:
          round: 2
          allow_fix: true
          start_sha: ${{ steps.start.outputs.sha }}
          base_ref: ${{ github.event.pull_request.base.ref }}
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}

      - name: 第3周
        id: r3
        if: steps.r2.outputs.status == 'continue'
        uses: ./.github/actions/loop-round
        with:
          round: 3
          allow_fix: true
          start_sha: ${{ steps.start.outputs.sha }}
          base_ref: ${{ github.event.pull_request.base.ref }}
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}

      - name: 最終確認（修正はしない）
        id: r4
        if: steps.r3.outputs.status == 'continue'
        uses: ./.github/actions/loop-round
        with:
          round: 4
          allow_fix: false
          start_sha: ${{ steps.start.outputs.sha }}
          base_ref: ${{ github.event.pull_request.base.ref }}
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}

      - name: 結果の反映
        env:
          START_SHA: ${{ steps.start.outputs.sha }}
          STATUS: ${{ steps.r4.outputs.status || steps.r3.outputs.status || steps.r2.outputs.status || steps.r1.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch="auto-fix/$PR"
          changed=false
          if [ "$(git rev-parse HEAD)" != "$START_SHA" ]; then changed=true; fi
          summary=$(jq -r '.summary // ""' .auto-loop/review.json 2>/dev/null || true)
          reason=$(cat .auto-loop/reason.txt 2>/dev/null || true)
          guard=$(tail -n 15 .auto-loop/guard.log 2>/dev/null || true)

          {
            echo "## auto-loop"
            echo
            echo "- 結果: **$STATUS**（clean=合格 / exhausted=指摘が残った / ng=不合格 / escalate=人の確認が必要 / error=エラー）"
            if [ -n "$summary" ]; then echo "- 最終レビュー: $summary"; fi
            if [ -n "$reason" ]; then echo "- 理由: $reason"; fi
            if [ -n "$guard" ]; then echo; echo '```'; echo "$guard"; echo '```'; fi
          } > .auto-loop/comment.md

          if [ "$STATUS" = clean ] && [ "$changed" = true ]; then
            git push -f origin "HEAD:refs/heads/$branch"
            pr_body="auto-loop による修正（PR #$PR）。検証とレビューに合格しました。マージは人が判断してください。ログ: $RUN_URL"
            if url=$(gh pr create --base "$BASE_REF" --head "$branch" --title "auto-loop: PR #$PR の修正" --body "$pr_body" 2>&1); then
              echo "- 修正PR: $url" >> .auto-loop/comment.md
            else
              # ActionsによるPRの作成が許可されていない場合は、作成用のリンクを案内する
              echo "- 修正を \`$branch\` に push しました。PRを作る: ${{ github.server_url }}/${{ github.repository }}/compare/$BASE_REF...$branch?expand=1" >> .auto-loop/comment.md
            fi
          elif [ "$STATUS" = clean ]; then
            echo "- 修正は不要でした（検証に合格し、重大度 high・medium の指摘もありません）。" >> .auto-loop/comment.md
          else
            echo "- 修正は push していません。" >> .auto-loop/comment.md
          fi
          echo >> .auto-loop/comment.md
          echo "実行ログ: $RUN_URL" >> .auto-loop/comment.md
          gh pr comment "$PR" --body-file .auto-loop/comment.md
          [ "$STATUS" = clean ]
