name: auto-review

# PRにラベル auto-review を付けると起動する。次の4つを、High・Mediumの指摘がなくなるまで繰り返す。
#   ソースレビュー → ソースレビュー修正（High・Mediumのみ）→ 動作確認 → デグレードなし確認
# 本体は scripts/auto_review.sh。各ラウンドの結果は auto-review/YYYYMMDDHHMMSS/ に集め、
# ZIP圧縮して auto-review/YYYYMMDDHHMMSS.zip だけを残す。
# 全ラウンドの修正とZIPは、最初のラウンドの日時で auto-review/<YYYYMMDDHHMMSS> ブランチへ1回 push する。
# これ以外のことはしない（PRの作成・コメントもしない）。
on:
  pull_request:
    types: [labeled]

concurrency:
  group: auto-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write   # auto-review/<YYYYMMDDHHMMSS> ブランチへのpush

jobs:
  review:
    # 同一リポジトリのPRだけを対象にする（forkのPRにはSecretを渡さない）
    if: >-
      github.event.label.name == 'auto-review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 360   # GitHub-hostedランナーの1ジョブの上限
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Claude Code の導入
        run: npm install -g @anthropic-ai/claude-code
      - name: auto-review（High・Mediumがなくなるまで繰り返す）
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/auto_review.sh
