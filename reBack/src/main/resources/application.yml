server:
  port: ${PORT:8081}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

spring:
  config:
    # reBack/.env があれば読み込む（OSの環境変数が優先）。
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:receipt_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jdbc:
    template:
      query-timeout: 20s

app:
  max-upload-bytes: 5242880
  auth:
    admin-username: ${ADMIN_USERNAME}
    admin-password-hash: ${ADMIN_PASSWORD_HASH}
    cookie-secure: ${SESSION_COOKIE_SECURE:true}
    login-max-failures: ${LOGIN_MAX_FAILURES:5}
    login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  # モンスターレシート対戦（doc/34_monster_receipt_battle_requirements.html）
  monster:
    wait-seconds: ${MONSTER_WAIT_SECONDS:90}
    room-ttl-minutes: ${MONSTER_ROOM_TTL_MINUTES:120}
    unresponsive-seconds: 60
    draft-ttl-hours: 24
    # Geminiでカードのイラスト（SVG）を作る。無効なら代替イラストを使う
    ai-illustration-enabled: ${MONSTER_AI_ILLUSTRATION:false}
    # Renderなどのプロキシの背後では true（X-Forwarded-For の末尾をIPとして使う）
    trust-forwarded-for: ${MONSTER_TRUST_FORWARDED_FOR:false}
    gemini-daily-limit-per-key: ${MONSTER_GEMINI_DAILY_LIMIT:200}
    # 機能追加前に保存されたレシートを再点検し、カードを作る
    backfill-on-startup: ${MONSTER_BACKFILL_ON_STARTUP:true}

gemini:
  receipt-model: gemini-3.5-flash-lite
  monster-model: ${GEMINI_MONSTER_MODEL:gemini-3.5-flash-lite}
  default-api-key: ${GEMINI_API_DEFAULT:}
  player1-api-key: ${GEMINI_API_PLAYER1:}
  player2-api-key: ${GEMINI_API_PLAYER2:}
  monster-api-key: ${GEMINI_API_MONSTER:}
  analyze-api-key: ${GEMINI_API_ANALYZE:}

logging:
  logback:
    rollingpolicy:
      file-name-pattern: "${LOG_FILE}.%d{yyyy-MM-dd}.%i.zip"

