<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <title>保存済みレシート一覧</title>
  <link rel="stylesheet" href="./styles.css?v=20261006-no-kinun">
</head>
<body>
  <main class="container">
    <p class="page-actions"><a id="back-link" class="back-link" href="https://sr5msym6xbw3oil22im7.github.io/">← メニューへ戻る</a><button id="logout-button" class="secondary-button small-button" type="button">ログアウト</button></p>
    <section class="card page-header">
      <div class="motif" data-motif="small" data-seed="55"></div>
      <div>
        <p class="eyebrow">Saved Receipts</p>
        <h1>保存済みレシート一覧</h1>
        <div class="flourish is-left"><svg aria-hidden="true"><use href="#gd" width="28" height="28"/></svg></div>
        <p class="lead">保存されたレシートを参照・削除できます。</p>
      </div>
    </section>

    <section class="card">
      <div class="list-toolbar">
        <p id="list-status" class="status" aria-live="polite">読み込み中...</p>
        <button id="delete-selected" class="danger-button small-button hidden" type="button" disabled>チェックしたレシートを削除</button>
      </div>
      <div id="receipt-list" class="receipt-list"></div>
    </section>

    <section id="detail-panel" class="card hidden" aria-live="polite">
      <div class="detail-heading">
        <h2>レシート詳細</h2>
        <button id="close-detail" class="secondary-button small-button" type="button">閉じる</button>
      </div>
      <div class="flourish is-left"><svg aria-hidden="true"><use href="#gd" width="28" height="28"/></svg></div>
      <p id="detail-meta" class="detail-meta"></p>
      <div id="detail-bubble" class="detail-body"></div>
    </section>
  </main>
  <script src="./config.js?v=20261006-no-kinun"></script>
  <script src="./admin-api.js?v=20261004-admin-only-receipt-api"></script>
  <script src="./select.js?v=20261006-gold-coin"></script>
</body>
</html>
