spring:
  datasource:
    url: jdbc:h2:mem:receipt;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
app:
  max-upload-bytes: 5242880
  auth:
    cookie-secure: false
  monster:
    # テストではGeminiを呼ばない
    ai-illustration-enabled: false
gemini:
  receipt-model: gemini-3.5-flash-lite
  default-api-key: test-default-key
