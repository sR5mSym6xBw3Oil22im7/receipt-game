services:
  - type: web
    # Keep the Render service name aligned with reFront/config.js.
    # Render derives the public onrender.com hostname from this name.
    name: receipt-game
    runtime: docker
    rootDir: reBack
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: GEMINI_API_DEFAULT
        sync: false
      - key: GEMINI_API_PLAYER1
        sync: false
      - key: GEMINI_API_PLAYER2
        sync: false
      - key: GEMINI_API_MONSTER
        sync: false
      - key: GEMINI_API_ANALYZE
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: MONSTER_AI_ILLUSTRATION
        value: "true"
      - key: MONSTER_TRUST_FORWARDED_FOR
        value: "true"
      # DBはH2のインメモリ（application-render.yml）。Render PostgreSQLは使わない
      - key: SPRING_PROFILES_ACTIVE
        value: render
